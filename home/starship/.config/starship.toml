# Starship prompt: the shape of the official Tokyo Night preset (starship preset
# tokyo-night), in Catppuccin Mocha colours to match the terminal, btop, lazygit and
# the desktop. Its icons and rounded edges need a Nerd Font (RobotoMono Nerd Font).
# The first segment shows the Ubuntu logo instead of Apple's.
#
#   ░▒▓ [ ubuntu ][ ~/folder ][  branch ✓ ][ languages ][  12:34 ]
#   ❯                 green, red after a command that failed

palette = "catppuccin_mocha"

format = """
[░▒▓](mauve)\
[  ](bg:mauve fg:crust)\
[](bg:blue fg:mauve)\
$directory\
[](fg:blue bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface0)\
$nodejs\
$rust\
$golang\
$php\
$python\
[](fg:surface0 bg:mantle)\
$cmd_duration\
$time\
[ ](fg:mantle)\
\n$character"""

[directory]
style = "fg:crust bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:surface1"
format = '[[ $symbol $branch ](fg:blue bg:surface1)]($style)'

[git_status]
style = "bg:surface1"
format = '[[($all_status$ahead_behind )](fg:peach bg:surface1)]($style)'

[nodejs]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol ($version) ](fg:green bg:surface0)]($style)'

[rust]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol ($version) ](fg:peach bg:surface0)]($style)'

[golang]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol ($version) ](fg:sapphire bg:surface0)]($style)'

[php]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol ($version) ](fg:lavender bg:surface0)]($style)'

[python]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol ($version)( $virtualenv) ](fg:yellow bg:surface0)]($style)'

# How long the last command took, when it was more than 3 seconds
[cmd_duration]
min_time = 3000
style = "bg:mantle"
format = '[[ 󱦟 $duration ](fg:yellow bg:mantle)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute
style = "bg:mantle"
format = '[[  $time ](fg:lavender bg:mantle)]($style)'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

# Catppuccin Mocha (catppuccin.com/palette)
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
