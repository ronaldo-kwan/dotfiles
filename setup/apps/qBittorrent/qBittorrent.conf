[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=@HOME@/.local/share/qBittorrent/logs
GUI\Notifications\TorrentAdded=false

[BitTorrent]
Session\Port=25602
Session\QueueingSystemEnabled=false
Session\SSL\Port=50263
Session\StartPaused=false

[Core]
AutoDeleteAddedTorrentFile=Never

[GUI]
DownloadTrackerFavicon=false
Log\Enabled=false
StartUpWindowState=Normal

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=8

[Preferences]
General\CloseToTrayNotified=true
General\CustomUIThemePath=@HOME@/.config/qBittorrent/themes/catppuccin-mocha.qbtheme
General\Locale=en
General\UseCustomUITheme=true

[RSS]
AutoDownloader\DownloadRepacks=true
AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"
