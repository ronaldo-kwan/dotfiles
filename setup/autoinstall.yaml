#cloud-config
# Automated install of Ubuntu Desktop with these dotfiles. In the Ubuntu installer,
# choose the automated installation and give it this file's address:
#   https://raw.githubusercontent.com/ronaldo-kwan/dotfiles/main/setup/autoinstall.yaml
#
# It answers language, keyboard, timezone, drivers, codecs and updates for you, and
# installs git, gum and gh. You still choose the disk (and encryption, with your own
# passphrase) and type your name and password yourself, so nothing secret is in this file.
# At your first login a terminal opens by itself and runs bootstrap.sh, once.
#
# Using a fork? Change the two addresses in late-commands and the bootstrap address in
# system/first-login/dotfiles-first-login, and your language/keyboard/timezone below.
autoinstall:
  version: 1
  # Asked in the installer as usual (so no password or disk choice is stored here):
  interactive-sections:
    - storage
    - identity
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Australia/Sydney
  drivers:
    install: true    # third-party drivers (the NVIDIA driver, Wi-Fi)
  codecs:
    install: true    # media codecs
  updates: all
  packages:
    - git
    - gum
    - gh
    - wget
  late-commands:
    # The one-time first-login step: a terminal that runs the dotfiles' bootstrap.sh.
    # (A failed download only skips it; run the one-line command from the README instead.)
    - curtin in-target -- sh -c 'wget -qO /usr/local/bin/dotfiles-first-login https://raw.githubusercontent.com/ronaldo-kwan/dotfiles/main/system/first-login/dotfiles-first-login && chmod 755 /usr/local/bin/dotfiles-first-login || true'
    - curtin in-target -- sh -c 'wget -qO /etc/xdg/autostart/dotfiles-setup.desktop https://raw.githubusercontent.com/ronaldo-kwan/dotfiles/main/system/first-login/dotfiles-setup.desktop || true'
