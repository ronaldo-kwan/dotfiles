<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Make Roboto the default for generic font families.
     Copied into each Flatpak app's ~/.var/app/<id>/config/fontconfig/ as well. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Roboto Mono</family></prefer>
  </alias>
</fontconfig>
