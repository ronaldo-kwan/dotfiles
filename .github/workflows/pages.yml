# Publishes the installer website (site/) to GitHub Pages:
#   https://ronaldo-kwan.github.io/dotfiles/
# site/options.json is generated from the repo's own lists, so the site always offers
# exactly what the scripts install.
name: website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - setup/**
      - install-apps.sh
      - scripts/build-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the options from the repo
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
