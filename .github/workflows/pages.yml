# Publishes the installer website (site/) to GitHub Pages:
#   https://ronaldo-kwan.github.io/dotfiles/
# site/options.json is generated from the repo's own lists, so the site always offers
# exactly what the scripts install.
name: website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - setup/**
      - install-apps.sh
      - scripts/build-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the options from the repo
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
