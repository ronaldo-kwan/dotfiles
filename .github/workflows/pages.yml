# Publishes the installer website (site/) to GitHub Pages:
#   https://ronaldo-kwan.github.io/dotfiles/
# site/options.json is generated from the repo's own lists, so the site always offers
# exactly what the scripts install; site/docs.json from README.md, docs/ and dot's own help.
name: website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - setup/**
      - install-apps.sh
      - dot
      - README.md
      - docs/**
      - scripts/build-site.py
      - .github/workflows/pages.yml
  # Pull requests only build: the deploy job is skipped, so nothing
  # is published, but a broken build or Pages action shows up before it's merged.
  pull_request:
    paths:
      - site/**
      - setup/**
      - install-apps.sh
      - dot
      - README.md
      - docs/**
      - scripts/build-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Each pull request gets its own group, so its builds never cancel a deploy from main
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

# Two jobs, so a failed deploy can be retried with "Re-run failed jobs": that re-runs only
# the deploy, which publishes the site the build already uploaded. (In one job, a retry
# uploaded the site a second time and the deploy refused to choose between the two.)
# It also gives GitHub time to list the upload before the deploy looks for it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true   # build-site.py offers the latest release tag
      - name: Build the options from the repo
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
