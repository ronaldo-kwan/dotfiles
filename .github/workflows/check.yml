# Checks every push to main and every pull request: script mistakes (scripts/lint.sh),
# and that install.sh works on a clean Ubuntu 26.04 (a container without a desktop, so
# desktop steps are skipped).
# Before setting up a new computer, run it by hand (docs/new-computer.md), so a maker
# changing a download link or signing key (Chrome, VS Code, Claude, ChatGPT, Proton VPN,
# ONLYOFFICE) shows up as a failed run, not halfway through the setup:
#   gh workflow run check.yml --repo ronaldo-kwan/dotfiles
name: check

on:
  # main only: a branch with a pull request is checked once, by pull_request, not twice.
  # (A branch without one can be checked by hand: gh workflow run check.yml --ref <branch>)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels the run it makes outdated. On main every
  # commit keeps its own run, so each one's result stays.
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: shellcheck, pyflakes, node --check (scripts/lint.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ubuntu 26.04's own shellcheck, pyflakes and node: the versions `sudo apt install` gives
    # on the computers, so scripts/lint.sh finds the same things there as here.
    container: ubuntu:26.04
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates shellcheck pyflakes3 nodejs >/dev/null
          git config --system --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so the token isn't kept in .git/config
      - name: scripts/lint.sh
        shell: bash   # a container's default is sh
        run: bash scripts/lint.sh

  quick:
    name: quick checks (workflows, helpers, secrets, website)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so the token isn't kept in .git/config
          fetch-depth: 0               # every commit and branch, for the secret check on the history
      - name: Workflow files (actionlint)
        # One fixed version, used only if its checksum matches (from the release's checksums.txt).
        # -shellcheck= : the scripts get their own shellcheck run (the lint job).
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp actionlint
          /tmp/actionlint -color -shellcheck=
      - name: Shared helpers and the app table (scripts/test-helpers.sh)
        run: bash scripts/test-helpers.sh
      - name: No secrets in any file (the pre-commit secret check, on the whole repo)
        # The hook only sees what a commit adds, and git commit --no-verify skips it:
        # here every file is checked, as if all were being added at once.
        run: |
          d="$(mktemp -d)"
          git ls-files -z | xargs -0 cp --parents -t "$d"
          cd "$d" && git init -q && git add -A
          bash "$GITHUB_WORKSPACE/.githooks/pre-commit"
      - name: No secrets anywhere in the history (the secret check with --history)
        # A secret a later commit removed is still in the history, and on GitHub.
        run: bash .githooks/pre-commit --history
      - name: The website's options build from the repo's lists
        run: python3 scripts/build-site.py
      - name: The system check (bootstrap.sh's copy and lib.sh's agree)
        run: |
          d=$(mktemp -d)
          printf 'ID=ubuntu\nVERSION_ID="26.04"\nPRETTY_NAME="Ubuntu 26.04 LTS"\n' > $d/ok
          printf 'ID=ubuntu\nVERSION_ID="24.04"\nPRETTY_NAME="Ubuntu 24.04 LTS"\n' > $d/old
          printf 'ID=linuxmint\nID_LIKE="ubuntu debian"\nPRETTY_NAME="Linux Mint 22"\n' > $d/mint
          printf 'ID=fedora\nPRETTY_NAME="Fedora Linux 43"\n' > $d/fedora
          sed -n '/^check_system() {/,/^}/p' bootstrap.sh > $d/boot.sh
          run() {  # run <lib|boot> <os> <desktop> [--yes|any]: prints "<exit code> <continues|stops>"
            local load="source ./bin/lib.sh >/dev/null" any=; [[ $1 == boot ]] && load="set -euo pipefail; source $d/boot.sh"
            [[ ${4:-} == any ]] && any=1
            OS_RELEASE_FILE=$d/$2 XDG_CURRENT_DESKTOP=$3 DOTFILES_SYSTEM_CHECKED= DOTFILES_ANY_SYSTEM=$any \
              bash -c "$load; check_system ${4/any/} && echo continues" </dev/null >$d/out 2>&1
            echo "$? $(grep -q continues $d/out && echo continues || echo stops)"
          }
          for impl in lib boot; do
            test "$(run $impl ok GNOME)" = "0 continues"
            test "$(run $impl old GNOME)" = "0 stops"            # asks; no answer = no
            test "$(run $impl old GNOME --yes)" = "0 stops"       # the website's --yes doesn't skip it
            test "$(run $impl old GNOME any)" = "0 continues"     # DOTFILES_ANY_SYSTEM=1 does
            test "$(run $impl mint X-Cinnamon)" = "0 stops"
            test "$(run $impl ok KDE)" = "0 stops"
            test "$(run $impl fedora GNOME)" = "1 stops"
            echo "$impl: ok"
          done

  install:
    name: install.sh on a clean Ubuntu 26.04
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash   # a container's default is sh, which lacks [[ ]]
    steps:
      - name: Tools that fresh-install.sh installs first (the ones a container can use)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git stow curl ca-certificates python3 fontconfig xz-utils gpg >/dev/null
          # System-wide, because install.sh replaces ~/.gitconfig with the one in this repo
          git config --system --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so the token isn't kept in .git/config
      - name: install.sh dry run (checks the pinned downloads, changes nothing)
        run: |
          DRY_RUN=1 ./bin/install.sh --yes | tee dry.txt
          grep -q 'would run: stow' dry.txt
          if [[ -e "$HOME/.bashrc" && -L "$HOME/.bashrc" ]] || [[ -d "$HOME/.local/share/fonts/RobotoMonoNerdFont" ]]; then
            echo "the dry run changed something"; exit 1
          fi
      - name: fresh-install.sh dry run (every step of a new computer's setup, changes nothing)
        run: |
          # A container has no GNOME, which fresh-install.sh would otherwise ask about first.
          DRY_RUN=1 DOTFILES_ANY_SYSTEM=1 ./bin/fresh-install.sh --yes | tee dry.txt
          grep -q 'would run: sudo apt-get -y full-upgrade' dry.txt          # 1. system update
          grep -q 'would run: sudo flatpak remote-add' dry.txt              # 3. Flathub
          grep -q 'would run: stow' dry.txt                                 # 4. install.sh
          grep -q 'update source signed with the expected key' dry.txt     # 5. install-apps.sh
          grep -q 'would apply your desktop look' dry.txt                   # the end
          if [[ -L "$HOME/.bashrc" ]] || command -v starship >/dev/null; then echo "the dry run changed something"; exit 1; fi
      - name: post-upgrade.sh dry run, on apt sources made to look upgraded
        run: |
          mkdir -p /tmp/src-dry
          printf 'Types: deb\nURIs: https://example.com\nSuites: stable\nComponents: main\nEnabled: no\n' > /tmp/src-dry/app.sources
          DRY_RUN=1 SOURCES_DIR=/tmp/src-dry ./bin/post-upgrade.sh --yes | tee dry.txt
          grep -q 'would run: sudo sed' dry.txt
          grep -qx 'Enabled: no' /tmp/src-dry/app.sources                  # not changed
      - name: install.sh
        run: ./bin/install.sh --yes
      - name: install.sh again (must be safe to run twice)
        run: ./bin/install.sh --yes
      - name: Config files are linked and the font is installed
        run: |
          ./bin/check.sh | tee check.txt || true
          grep -q '✔ all config files linked' check.txt
          grep -q '✔ RobotoMono Nerd Font' check.txt
          test "$(git config core.hooksPath)" = "$PWD/.githooks"
      - name: dot command works
        run: |
          ./dot help > help.txt && cat help.txt   # (not piped into grep -q: dot would get SIGPIPE)
          grep -q 'push \[message\]' help.txt
          ./dot                                   # no terminal: the status lines and the list
          ./dot install --help                    # explains it; doesn't start install.sh
          if ./dot frobnicate; then exit 1; else test $? = 2; fi
      - name: install-apps.sh dry run (checks every download source, installs nothing)
        run: DRY_RUN=1 ./bin/install-apps.sh
      - name: post-upgrade.sh on a copy of apt sources made to look upgraded
        run: |
          mkdir -p /tmp/src
          printf 'Types: deb\nURIs: https://example.com\nSuites: stable\nComponents: main\nEnabled: no\n' > /tmp/src/app.sources
          printf '# deb https://example.com stable main # disabled on upgrade to next\n' > /tmp/src/app.list
          SOURCES_DIR=/tmp/src SUDO= ./bin/post-upgrade.sh --sources-only
          grep -qx 'Enabled: yes' /tmp/src/app.sources
          grep -qx 'deb https://example.com stable main' /tmp/src/app.list
      - name: Secret check catches a made-up token
        run: |
          cd "$(mktemp -d)" && git init -q
          printf 'TOKEN=%s\n' "ghp_$(printf 'a%.0s' $(seq 36))" > leak.sh && git add leak.sh
          if "$GITHUB_WORKSPACE/.githooks/pre-commit"; then echo "should have been stopped"; exit 1; fi
      - name: uninstall.sh dry run changes nothing
        run: |
          before="$(find "$HOME" -type l | sort)"
          DRY_RUN=1 ./bin/uninstall.sh --apps --yes | tee dry.txt
          grep -q 'would run: rm' dry.txt
          test "$before" = "$(find "$HOME" -type l | sort)"
          test "$(git config core.hooksPath)" = "$PWD/.githooks"
      - name: uninstall.sh --apps removes every link, what the dotfiles added and the jobs
        run: |
          # Two terminal tools and a weekly job (sudo: the scripts use it). bat counts as added
          # by the dotfiles (as fresh-install.sh records it); fzf as one you had before.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo bat fzf >/dev/null
          mkdir -p /etc/cron.weekly && printf '#!/bin/sh\n' > /etc/cron.weekly/system-update
          added="$HOME/.local/state/dotfiles/added"
          test -f "$added" && ! grep -qx legacy "$added"   # install.sh started a fresh record
          echo pkg:bat >> "$added"
          ./bin/uninstall.sh --apps --yes
          if dpkg -s bat >/dev/null 2>&1; then echo "still installed: bat (the dotfiles added it)"; exit 1; fi
          dpkg -s fzf >/dev/null 2>&1 || { echo "fzf was removed, but the dotfiles didn't add it"; exit 1; }
          if grep -qx pkg:bat "$added"; then echo "the record wasn't emptied after --apps"; exit 1; fi
          test ! -e /etc/cron.weekly/system-update
          left="$(find "$HOME" -type l | while read -r l; do [[ "$(readlink -f "$l")" == "$PWD"/* ]] && echo "$l"; done)"
          test -z "$left" || { echo "still linked: $left"; exit 1; }
          if [[ -L "$HOME/.bashrc" || ! -f "$HOME/.bashrc" ]]; then echo "~/.bashrc is still a link, or missing"; exit 1; fi
          test -z "$(git config core.hooksPath || true)"

  desktop:
    name: desktop settings go on and come off (no screen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash   # a container's default is sh, which lacks [[ ]]
    steps:
      - name: Tools, and GNOME's settings (dconf, gsettings and their schemas) without a desktop
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git stow curl ca-certificates python3 fontconfig xz-utils \
            dbus-daemon dconf-cli dconf-gsettings-backend libglib2.0-bin \
            gsettings-desktop-schemas gnome-shell-common >/dev/null
          git config --system --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so the token isn't kept in .git/config
      - name: install.sh loads every saved setting, uninstall.sh resets them (scripts/test-desktop.sh)
        env:
          CI: true
        run: dbus-run-session -- bash scripts/test-desktop.sh

  choices:
    name: install.sh follows the website's choices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash   # a container's default is sh, which lacks [[ ]]
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git stow curl ca-certificates python3 fontconfig xz-utils gpg >/dev/null
          git config --system --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes, so the token isn't kept in .git/config
      - name: How the choices are read (DOTFILES_CHOICES, DOTFILES_SKIP, the choices file)
        run: |
          DOTFILES_SKIP='claude-md app:steam' bash -c 'source bin/lib.sh
            chosen terminal && chosen app:chrome && ! chosen claude-md && ! chosen app:steam'
          DOTFILES_CHOICES='terminal pkg:vlc' bash -c 'source bin/lib.sh
            chosen terminal && chosen pkg:vlc && ! chosen desktop && chosen_any pkg: && ! chosen_any app:'
          mkdir -p /tmp/h/.config/dotfiles && printf 'terminal\n-app:steam\n' > /tmp/h/.config/dotfiles/choices
          HOME=/tmp/h bash -c 'source bin/lib.sh
            [[ "$DOTFILES_CHOICES" == terminal && "$DOTFILES_SKIP" == app:steam ]]'
      - name: install.sh with only the terminal and safety checks chosen (as bootstrap.sh saves them)
        run: |
          mkdir -p "$HOME/.config/dotfiles"
          printf 'terminal\nsafety\n' > "$HOME/.config/dotfiles/choices"
          ./bin/install.sh --yes
      - name: Only the chosen config files are linked
        run: |
          for f in .bashrc .config/ghostty/config .config/starship.toml .config/systemd/user/dotfiles-reminder.timer; do
            test -L "$HOME/$f" || { echo "should be linked: ~/$f"; exit 1; }
          done
          for f in .config/Code/User/settings.json .claude/CLAUDE.md .config/fontconfig/fonts.conf; do
            test ! -e "$HOME/$f" || { echo "not chosen, but there: ~/$f"; exit 1; }
          done
      - name: dot check shows the rest as not chosen
        run: |
          ./bin/check.sh | tee check.txt || true
          grep -q '✔ all config files linked' check.txt
          grep -q 'Roboto Mono: not chosen' check.txt
          grep -q 'Google Chrome.*not chosen' check.txt
          grep -q 'Obsidian vault: not chosen' check.txt
